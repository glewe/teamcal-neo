name: Release Build

# The distribution repo is populated by tools/build.php in the development repo (composer release).
# Tagging vX.Y.Z here turns exactly what is committed into the release ZIP - nothing is built on the runner.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create ZIP Archive
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          zip -r "teamcal-neo-$VERSION.zip" . -x ".git/*" -x ".github/*" -x "RELEASE_NOTES.md" -x "*.zip"

      - name: Create Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: "*.zip"
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
